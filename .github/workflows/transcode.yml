name: MHBD Cloud Transcoder Worker

on:
  repository_dispatch:
    types: [transcode_video]
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Video ID'
        required: true
      quality:
        description: 'Target Quality (e.g. 720p)'
        required: true
        default: '720p'

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Worker Scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Run Cloud Transcoding
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python transcode_worker.py
